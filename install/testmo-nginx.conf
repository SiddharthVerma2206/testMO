# testMO metrics API — /etc/nginx/sites-available/testmo
#
# Plain HTTP for now. The agent validates X-TestMO-Key itself, so nothing here
# knows the key and rotating it never needs an nginx reload.
#
# To add TLS later, generate a cert and add to this block:
#     listen 9443 ssl;
#     ssl_certificate     /etc/ssl/testmo/cert.pem;
#     ssl_certificate_key /etc/ssl/testmo/key.pem;
# No agent change is required.

server {
    listen 9443;
    listen [::]:9443;

    server_name _;

    # Nothing here should ever be cached by an intermediary.
    add_header Cache-Control "no-store" always;

    location /api/v1/ {
        limit_req zone=testmo burst=20 nodelay;

        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # /internal/metrics is deliberately absent: it is unauthenticated and must
    # stay reachable only from localhost, where Prometheus scrapes it.
    location / {
        return 404 '{"error":"not found"}';
        default_type application/json;
    }
}
