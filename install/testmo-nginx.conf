# testMO metrics API, plain HTTP — /etc/nginx/sites-available/testmo
#
# Installed verbatim when setup.sh is run WITHOUT --domain. With --domain it is
# replaced by testmo-nginx-tls.conf.tmpl, which is the same server block with a
# TLS listener; setup.sh obtains the certificate from Let's Encrypt and sets up
# renewal. The agent is identical either way — it speaks plain HTTP on loopback
# and nginx terminates TLS in front of it.
#
# Know what plain HTTP costs before choosing it: a browser on an https:// page
# CANNOT call this. Every request is blocked as mixed content before it leaves
# the page, so the dashboard sees a network error with no status code, and the
# API key crosses the internet in the clear for the callers that do get through
# (curl, scripts). This variant is for exactly two cases — a curl-only install,
# and bringing a box up before its DNS record exists. Re-run with --domain to
# switch; the API key survives.
#
# The agent validates X-TestMO-Key itself, so nothing here knows the key and
# rotating it never needs an nginx reload.

server {
    listen 9443;
    listen [::]:9443;

    server_name _;

    # Nothing here should ever be cached by an intermediary.
    add_header Cache-Control "no-store" always;

    location /api/v1/ {
        limit_req zone=testmo burst=20 nodelay;

        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # /internal/metrics is deliberately absent: it is unauthenticated and must
    # stay reachable only from localhost, where Prometheus scrapes it.
    location / {
        return 404 '{"error":"not found"}';
        default_type application/json;
    }
}
