chain_type: "cosmos"
client_name: "gaiad"

# CometBFT exposes Prometheus on :26660 only when instrumentation.prometheus
# = true in config.toml. Uncomment if you have enabled it.
# metrics_port: 26660
# metrics_path: "/metrics"

# Tendermint RPC is plain HTTP GET returning JSON, not JSON-RPC POST — hence
# type: http_get, where `method` is a URL path and `path` walks the whole body.
rpc:
  url: "http://127.0.0.1:26657"
  timeout: "3s"
  interval: "5s"

local_calls:
  - name: "probe_catching_up"
    type: "http_get"
    method: "/status"
    extract: {path: "result.sync_info.catching_up", type: "bool"}

  # Tendermint quotes its integers ("12345"); extract type number parses those.
  - name: "probe_block_height"
    type: "http_get"
    method: "/status"
    extract: {path: "result.sync_info.latest_block_height", type: "number"}

  - name: "probe_peers"
    type: "http_get"
    method: "/net_info"
    extract: {path: "result.n_peers", type: "number"}

metric_map:
  testMO_rpc_up: 'probe_call_up{call="probe_catching_up"}'
  testMO_syncing: "probe_catching_up"
  testMO_block_height: "probe_block_height"
  testMO_peers: "probe_peers"

  # No network tip in /status, so there is no progress percentage — a climbing
  # height is what catching up looks like here.
  testMO_blocks_per_minute: "deriv(probe_block_height[5m]) * 60"

  testMO_rpc_latency_ms: 'probe_call_duration_ms{call="probe_catching_up"}'
  testMO_rpc_latency_p50_ms: 'quantile_over_time(0.50, probe_call_duration_ms{call="probe_catching_up"}[30m])'
  testMO_rpc_latency_p95_ms: 'quantile_over_time(0.95, probe_call_duration_ms{call="probe_catching_up"}[30m])'
  testMO_rpc_latency_p99_ms: 'quantile_over_time(0.99, probe_call_duration_ms{call="probe_catching_up"}[30m])'

  testMO_rpc_flaps_1h: 'changes(probe_call_up{call="probe_catching_up"}[1h])'
