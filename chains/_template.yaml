# Copy this file to <chain>.yaml and fill it in for a new chain.
#
# Two ways to get a number out of a node, mix freely:
#   1. The client exposes Prometheus itself  -> set metrics_port/metrics_path,
#      then reference its metric names directly in metric_map.
#   2. It doesn't (or lacks the metric)      -> add a local_call that queries
#      the RPC, then reference that gauge by name in metric_map.

chain_type: ""        # e.g. "ethereum-reth", "bitcoin-core"
client_name: ""       # e.g. "reth", "bitcoind"

# --- Native Prometheus endpoint. Omit both if the client has none. ---
# metrics_port: 0
# metrics_path: "/metrics"

# --- Direct RPC probing. Omit this whole section if not needed. ---
# rpc:
#   url: "http://127.0.0.1:8545"
#   timeout: "3s"        # default 5s; keep it under interval
#   interval: "5s"       # default 15s. Match the Prometheus scrape interval:
#                        # poll slower and Prometheus records the same value
#                        # twice, poll faster and it discards the extras.
#   basic_auth:          # bitcoind and friends
#     user: ""
#     password: ""

# Each entry publishes one Prometheus gauge named `name`.
#
#   type:     jsonrpc (default) POSTs {"method": ..., "params": ...} to rpc.url
#             http_get          GETs rpc.url + method
#   path:     dot-path into the response, numeric segments index arrays.
#             Relative to "result" for jsonrpc, to the whole body for http_get.
#             Omit to use the value as-is.
#   type:     number  JSON number, or a quoted one ("12345")
#             hex     "0x4a817c800" -> 20000000000
#             bool    false/null -> 0, anything else -> 1
#             count   length of a JSON array
#             match   string lookup in `values`, falling back to `default`
#   optional: true when the call is EXPECTED to fail in some node state, which
#             silences its failure log. Everything else is unchanged: the gauge
#             still drops and probe_call_up still goes to 0.
#             Use it for eth_syncing's highestBlock (gone once synced) and
#             Solana's getHealth (errors when behind) — without it a healthy
#             node writes a failure line every 5s and buries the real ones.
#
# Two gauges are published automatically for every call, no config needed:
#   probe_call_duration_ms{call="<name>"}   round-trip time
#   probe_call_up{call="<name>"}            1 ok, 0 failed
#
# A call that fails drops its gauge entirely rather than going stale, so the
# metric reads as "no data" rather than a wrong-but-plausible last value.
#
# Pick ONE cheap call that succeeds whenever RPC is alive — regardless of sync
# state — and hang rpc_up, latency and flaps off it. A call that fails when the
# node is merely behind would report a healthy-but-catching-up node as down.
#
# local_calls:
#   - name: "probe_syncing"
#     method: "eth_syncing"
#     params: []
#     extract: {type: "bool"}

# --- testMO name -> PromQL. -------------------------------------------------
#
# Nothing is mandatory. The agent serves whatever these two blocks define and
# the dashboard renders whatever the agent returns — a name absent from both
# simply doesn't exist for this chain, and the dashboard won't show a slot for
# it. The split between the two blocks is organisational only; config.go
# merges them and treats them identically.
#
# Values are PromQL, so they can reference native client metrics, probe_*
# gauges, or expressions combining them.

metric_map:
  testMO_rpc_up: ""             # probe_call_up{call="<the cheap call>"}
  testMO_syncing: ""            # 0 = synced, 1 = syncing
  testMO_block_height: ""       # current block/height
  testMO_peers: ""              # connected peer count

  # Is the chain advancing. Catches a node frozen at one block that still has
  # peers and reports synced. deriv(), not rate() — these are gauges, and
  # rate() would read a reorg as a counter reset and spike.
  # testMO_blocks_per_minute: "deriv(probe_block_height[5m]) * 60"

  # Latency is measured agent -> loopback, so it is the node's own RPC
  # responsiveness, not what a customer sees over the internet.
  # testMO_rpc_latency_ms: 'probe_call_duration_ms{call="probe_syncing"}'
  #
  # 30m at a 5s scrape is ~360 samples: p50/p95 are solid, p99 is roughly the
  # 4th worst reading, so treat it as "worst case lately". A 5m window would
  # be 60 samples, where p99 is just the max and jumps every refresh.
  # testMO_rpc_latency_p50_ms: 'quantile_over_time(0.50, probe_call_duration_ms{call="probe_syncing"}[30m])'
  # testMO_rpc_latency_p95_ms: 'quantile_over_time(0.95, probe_call_duration_ms{call="probe_syncing"}[30m])'
  # testMO_rpc_latency_p99_ms: 'quantile_over_time(0.99, probe_call_duration_ms{call="probe_syncing"}[30m])'

  # Proxy for "the node restarted" — a clean restart shows as 2 (down, up).
  # testMO_rpc_flaps_1h: 'changes(probe_call_up{call="probe_syncing"}[1h])'

optional_metrics:
  # Sync progress, where the chain exposes a target to measure against. Both
  # go null once synced, which is the same thing testMO_syncing: 0 says.
  # testMO_sync_target_block: "probe_sync_target"
  # testMO_sync_progress_pct: "100 * probe_block_height / probe_sync_target"
