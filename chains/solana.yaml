chain_type: "solana"
client_name: "agave"

# Agave has no Prometheus endpoint — its native metrics push to InfluxDB.
# Everything below is probed from RPC.

rpc:
  url: "http://127.0.0.1:8899"
  timeout: "3s"
  interval: "5s"

local_calls:
  # Returns "ok" when caught up, and a JSON-RPC *error* when behind — so an
  # unhealthy node fails this probe rather than answering it. Hence optional;
  # testMO_syncing turns the absence back into 1 with `or vector(1)`.
  - name: "probe_health"
    method: "getHealth"
    optional: true
    extract:
      type: "match"
      values: {"ok": 0}
      default: 1

  # Succeeds whenever RPC is alive regardless of sync state, so rpc_up and
  # latency hang off this rather than getHealth.
  - name: "probe_block_height"
    method: "getBlockHeight"
    extract: {type: "number"}

  - name: "probe_peers"
    method: "getClusterNodes"
    extract: {type: "count"}

metric_map:
  testMO_rpc_up: 'probe_call_up{call="probe_block_height"}'
  testMO_syncing: "probe_health or vector(1)"
  testMO_block_height: "probe_block_height"
  testMO_peers: "probe_peers"

  # No cluster-wide target slot exposed, so there is no progress percentage.
  testMO_blocks_per_minute: "deriv(probe_block_height[5m]) * 60"

  testMO_rpc_latency_ms: 'probe_call_duration_ms{call="probe_block_height"}'
  testMO_rpc_latency_p50_ms: 'quantile_over_time(0.50, probe_call_duration_ms{call="probe_block_height"}[30m])'
  testMO_rpc_latency_p95_ms: 'quantile_over_time(0.95, probe_call_duration_ms{call="probe_block_height"}[30m])'
  testMO_rpc_latency_p99_ms: 'quantile_over_time(0.99, probe_call_duration_ms{call="probe_block_height"}[30m])'

  testMO_rpc_flaps_1h: 'changes(probe_call_up{call="probe_block_height"}[1h])'
