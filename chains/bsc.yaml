chain_type: "bsc-geth"
client_name: "geth"

# BSC's client is a geth fork, so it exposes the same /debug/metrics/prometheus
# endpoint. Needs --metrics on the node; the address defaults to 127.0.0.1:6060.
metrics_port: 6060
metrics_path: "/debug/metrics/prometheus"

rpc:
  url: "http://127.0.0.1:8545"
  timeout: "3s"
  interval: "5s"

local_calls:
  - name: "probe_syncing"
    method: "eth_syncing"
    params: []
    extract: {type: "bool"}

# --- metric_map ---------------------------------------------------------------
# Every name ends in its unit — see the suffix table in _template.yaml. The API
# returns bare floats, so the suffix is the only thing telling the dashboard
# whether 3416861328 is bytes, milliseconds or a block number.
#
# Convert to the canonical unit HERE, in the PromQL, not in the dashboard. geth
# exposes its timers in nanoseconds, so anything read out of one is divided by
# 1e6 below. Doing it here means every consumer agrees, and /metrics/history
# returns the same units as /metrics.
#
# Timers are Prometheus *summaries*: a bare `chain_execution` matches several
# series at once ({quantile="0.5"}, "0.95", "0.99", plus _count and _sum) and
# resolves to nothing. They always need a quantile selector.

metric_map:
  # --- Liveness. 0/1 flags, rendered as a badge, never as a number. ---
  testMO_rpc_up: 'probe_call_up{call="probe_syncing"}'
  testMO_syncing: "probe_syncing"

  # --- Chain position. Plain integers, no unit. ---
  testMO_block_height: "chain_head_block"
  testMO_chain_head_header: "chain_head_header"
  testMO_chain_head_finalized: "chain_head_finalized"
  testMO_blocks_per_min: "deriv(chain_head_block[5m]) * 60"

  # --- Peers. Plain integer. ---
  testMO_peers: "p2p_peers"

  # --- Agent -> node RPC latency, measured on loopback by the prober. ---
  testMO_rpc_latency_ms: 'probe_call_duration_ms{call="probe_syncing"}'
  testMO_rpc_latency_p50_ms: 'quantile_over_time(0.50, probe_call_duration_ms{call="probe_syncing"}[30m])'
  testMO_rpc_latency_p95_ms: 'quantile_over_time(0.95, probe_call_duration_ms{call="probe_syncing"}[30m])'
  testMO_rpc_latency_p99_ms: 'quantile_over_time(0.99, probe_call_duration_ms{call="probe_syncing"}[30m])'
  testMO_rpc_flaps_1h: 'changes(probe_call_up{call="probe_syncing"}[1h])'

  # --- The node's own timers. Nanoseconds at the source, hence / 1e6. ---
  testMO_block_execution_p95_ms: 'chain_execution{quantile="0.95"} / 1e6'
  testMO_rpc_server_p95_ms: 'rpc_duration_all{quantile="0.95"} / 1e6'

  # Peer round-trip as the node measures it, unlike testMO_rpc_latency_ms which
  # is this agent talking to loopback. VERIFY THE SCALE before trusting it: if
  # the number reads in the thousands it is microseconds and wants / 1e3, and
  # if it is a gauge rather than a summary drop the quantile selector.
  testMO_peer_latency_p95_ms: 'p2p_peers_normal_latency{quantile="0.95"}'

  # --- RPC served by the node. Cumulative since the node started, so they only
  # ever climb; a restart resets them to 0. _pct is the readable one. ---
  testMO_rpc_requests_total: "rpc_requests"
  testMO_rpc_success_total: "rpc_success"
  testMO_rpc_failure_total: "rpc_failure"
  testMO_rpc_success_pct: "100 * rpc_success / clamp_min(rpc_requests, 1)"

  # --- The client process itself, as the client reports it. Distinct from the
  # system block's testMO_cpu_usage_pct / testMO_memory_usage_pct, which
  # node_exporter measures for the whole box. ---
  #
  # procload is percent of ONE core, so it exceeds 100 on a busy multi-core box
  # — cap the gauge at `nproc * 100`, not at 100. Cross-check it against `top`
  # once: if it reads ~100x smaller than the process's real CPU use, the source
  # is a hundredths-of-a-percent integer and this wants `* 100`.
  testMO_cpu_procload_pct: "system_cpu_procload"
  testMO_cpu_sysload_pct: "system_cpu_sysload"
  testMO_client_memory_bytes: "system_memory_used"
