chain_type: "any_chain-geth"
client_name: "geth"

# Requires --metrics --metrics.addr 127.0.0.1 --metrics.port 6060.
# Scraped by Prometheus as job 'rpc_client'; the chain_* / p2p_* expressions
# below read it.
metrics_port: 6060
metrics_path: "/debug/metrics/prometheus"

rpc:
  url: "http://127.0.0.1:8545"
  timeout: "3s"
  interval: "5s"

local_calls:
  - name: "probe_syncing"
    method: "eth_syncing"
    params: []
    extract: {type: "bool"}

  - name: "probe_chain_id"
    method: "eth_chainId"
    extract: {type: "hex"}

metric_map:
  testMO_rpc_up: 'probe_call_up{call="probe_syncing"}'
  testMO_syncing: "probe_syncing"
  testMO_chain_id: "probe_chain_id"

  testMO_current_block: "chain_head_block"
  testMO_blocks_per_min: "deriv(chain_head_block[5m]) * 60"

  # testMO_txpool_pending: "txpool_pending"
  # testMO_txpool_queued: "txpool_queued"
  # testMO_txpool_slots: "txpool_slots"
  # testMO_txpool_invalid: "txpool_invalid"
  # testMO_txpool_overflowed: "txpool_overflowed"

  # Block insertion time as geth measures it. Nanoseconds at the source.
  # testMO_block_insert_p95_ms: 'chain_inserts{quantile="0.95"} / 1e6'
  # testMO_: ""
  
  testMO_peers: "p2p_peers"
  testMO_peer_latency_p95_ms: 'p2p_peers_normal_latency{quantile="0.95"}'

  testMO_rpc_latency_ms: 'probe_call_duration_ms{call="probe_syncing"}'
  testMO_rpc_latency_p50_ms: 'quantile_over_time(0.50, probe_call_duration_ms{call="probe_syncing"}[30m])'
  testMO_rpc_latency_p95_ms: 'quantile_over_time(0.95, probe_call_duration_ms{call="probe_syncing"}[30m])'
  testMO_rpc_latency_p99_ms: 'quantile_over_time(0.99, probe_call_duration_ms{call="probe_syncing"}[30m])'

  testMO_rpc_requests_total: "rpc_requests"
  testMO_rpc_success_total: "rpc_success"
  testMO_rpc_failure_total: "rpc_failure"
  testMO_rpc_success_pct: "100 * rpc_success / clamp_min(rpc_requests, 1)"